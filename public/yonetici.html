<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yönetici Paneli | HANGİSİ ASAL?</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .login-card {
      max-width: 430px;
      margin: 80px auto;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #111827;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 15px;
      background: white;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin: 4px;
    }

    button:hover {
      opacity: 0.9;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .print-button {
      background: #059669;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .topbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .filter-area {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 15px;
      align-items: end;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #2563eb;
      margin-top: 5px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    th {
      background: #f3f4f6;
      font-weight: bold;
    }

    tr:hover td {
      background: #f9fafb;
    }

    .avatar {
      font-size: 25px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 700px) {

      .container {
        width: 94%;
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .filter-area {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: stretch;
      }

      .topbar-buttons {
        width: 100%;
      }

      .topbar-buttons button {
        flex: 1;
      }

    }

    /* =========================
       YAZDIRMA
    ========================= */

    @media print {

      body {
        background: white;
      }

      .container {
        width: 100%;
        max-width: none;
        margin: 0;
      }

      .card {
        box-shadow: none;
        border-radius: 0;
        padding: 0;
      }

      .topbar-buttons,
      .filter-area,
      .stats,
      .message {
        display: none !important;
      }

      table {
        min-width: 0;
        width: 100%;
        font-size: 11px;
      }

      th,
      td {
        padding: 7px 5px;
        border: 1px solid #999;
      }

      h1 {
        text-align: center;
        margin-bottom: 5px;
      }

      .subtitle {
        text-align: center;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       GİRİŞ
  ========================= -->

  <div
    id="loginPage"
    class="container"
  >

    <div class="card login-card">

      <h1>🔐 Yönetici Paneli</h1>

      <div class="subtitle">
        HANGİSİ ASAL? | Murat Hoca İle Matematik
      </div>

      <div
        id="loginMessage"
        class="message error"
      ></div>

      <input
        id="password"
        type="password"
        placeholder="Yönetici şifresi"
        autocomplete="current-password"
      >

      <button
        class="primary"
        onclick="login()"
      >
        🔓 Giriş Yap
      </button>

    </div>

  </div>


  <!-- =========================
       YÖNETİCİ PANELİ
  ========================= -->

  <div
    id="panelPage"
    class="container hidden"
  >

    <div class="card">

      <div class="topbar">

        <div>

          <h1>
            🏆 HANGİSİ ASAL?
          </h1>

          <div class="subtitle">
            Murat Hoca İle Matematik — Yönetici Paneli
          </div>

        </div>

        <div class="topbar-buttons">

          <button
            class="secondary"
            onclick="loadResults()"
          >
            🔄 Yenile
          </button>

          <button
            class="print-button"
            onclick="printResults()"
          >
            🖨️ Yazdır
          </button>

          <button
            class="danger"
            onclick="logout()"
          >
            🚪 Çıkış
          </button>

        </div>

      </div>


      <div
        id="panelMessage"
        class="message success"
      ></div>


      <!-- =========================
           SINIF FİLTRESİ
      ========================= -->

      <div class="filter-area">

        <div>

          <label for="grade">
            <strong>Sınıf Seç:</strong>
          </label>

          <select
            id="grade"
            onchange="loadResults()"
          >

            <option value="">
              Tüm Sınıflar
            </option>

            <option value="4">
              4. Sınıf
            </option>

            <option value="5">
              5. Sınıf
            </option>

            <option value="6">
              6. Sınıf
            </option>

            <option value="7">
              7. Sınıf
            </option>

            <option value="8">
              8. Sınıf
            </option>

            <option value="Diger">
              Diğer
            </option>

          </select>

        </div>

      </div>


      <!-- =========================
           İSTATİSTİKLER
      ========================= -->

      <div class="stats">

        <div class="stat">

          <div>
            👥 Katılımcı
          </div>

          <div
            id="count"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div>
            🏆 En Yüksek Puan
          </div>

          <div
            id="bestScore"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div>
            ⏱️ En İyi Süre
          </div>

          <div
            id="bestTime"
            class="stat-number"
          >
            -
          </div>

        </div>

      </div>


      <!-- =========================
           SONUÇLAR
      ========================= -->

      <h2>
        📋 Öğrenci Sonuçları
      </h2>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                Sıra
              </th>

              <th>
                Avatar
              </th>

              <th>
                Ad Soyad
              </th>

              <th>
                Sınıf
              </th>

              <th>
                Doğru
              </th>

              <th>
                Puan
              </th>

              <th>
                Süre
              </th>

            </tr>

          </thead>

          <tbody id="resultsBody">

            <tr>

              <td
                colspan="7"
                class="empty"
              >
                Sonuçlar yükleniyor...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       DEĞİŞKENLER
    ========================= */

    let adminToken = sessionStorage.getItem(
      "adminToken"
    );


    /* =========================
       SAYFA BAŞLANGICI
    ========================= */

    if (adminToken) {

      showPanel();

    } else {

      showLogin();

    }


    /* =========================
       GİRİŞ
    ========================= */

    async function login() {

      const password =
        document
          .getElementById("password")
          .value
          .trim();

      if (!password) {

        showLoginMessage(
          "Lütfen yönetici şifresini girin."
        );

        return;

      }

      try {

        const response =
          await fetch(
            "/api/admin/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                password: password
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          showLoginMessage(
            data.error ||
            "Giriş başarısız."
          );

          return;

        }


        adminToken =
          data.token;

        sessionStorage.setItem(
          "adminToken",
          adminToken
        );


        showPanel();


      } catch (error) {

        showLoginMessage(
          "Sunucuya bağlanırken bir hata oluştu."
        );

      }

    }


    /* =========================
       PANELİ GÖSTER
    ========================= */

    function showPanel() {

      document
        .getElementById("loginPage")
        .classList
        .add("hidden");

      document
        .getElementById("panelPage")
        .classList
        .remove("hidden");

      loadResults();

    }


    /* =========================
       GİRİŞ SAYFASINI GÖSTER
    ========================= */

    function showLogin() {

      document
        .getElementById("loginPage")
        .classList
        .remove("hidden");

      document
        .getElementById("panelPage")
        .classList
        .add("hidden");

    }


    /* =========================
       ÇIKIŞ
    ========================= */

    function logout() {

      sessionStorage.removeItem(
        "adminToken"
      );

      adminToken = null;

      showLogin();

      document
        .getElementById("password")
        .value = "";

    }


    /* =========================
       SONUÇLARI GETİR
    ========================= */

    async function loadResults() {

      const grade =
        document
          .getElementById("grade")
          .value;


      const url =
        grade
          ? `/api/admin/results?grade=${encodeURIComponent(grade)}`
          : "/api/admin/results";


      try {

        const response =
          await fetch(
            url,
            {
              headers: {
                "x-admin-token":
                  adminToken
              }
            }
          );


        if (response.status === 401) {

          logout();

          showLoginMessage(
            "Oturumunuz sona erdi. Lütfen tekrar giriş yapın."
          );

          return;

        }


        const data =
          await response.json();


        if (!response.ok) {

          showPanelMessage(
            data.error ||
            "Sonuçlar alınamadı.",
            true
          );

          return;

        }


        renderResults(
          data.results || []
        );


      } catch (error) {

        showPanelMessage(
          "Sonuçlar yüklenirken hata oluştu.",
          true
        );

      }

    }


    /* =========================
       SONUÇLARI GÖSTER
    ========================= */

    function renderResults(results) {

      const body =
        document
          .getElementById("resultsBody");


      document
        .getElementById("count")
        .textContent =
          results.length;


      if (!results.length) {

        document
          .getElementById("bestScore")
          .textContent = "0";

        document
          .getElementById("bestTime")
          .textContent = "-";


        body.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="empty"
            >
              Henüz sonuç bulunmuyor.
            </td>

          </tr>

        `;

        return;

      }


      const bestScore =
        Math.max(
          ...results.map(
            item =>
              Number(item.score || 0)
          )
        );


      const validTimes =
        results
          .map(
            item =>
              Number(item.time || 0)
          )
          .filter(
            time =>
              time > 0
          );


      const bestTime =
        validTimes.length
          ? Math.min(...validTimes)
          : 0;


      document
        .getElementById("bestScore")
        .textContent =
          bestScore;


      document
        .getElementById("bestTime")
        .textContent =
          bestTime
            ? formatTime(bestTime)
            : "-";


      body.innerHTML =
        results
          .map(
            (item, index) => `

              <tr>

                <td>
                  ${index + 1}
                </td>

                <td class="avatar">
                  ${escapeHtml(
                    item.avatar || "🙂"
                  )}
                </td>

                <td>
                  <strong>
                    ${escapeHtml(
                      item.name || "-"
                    )}
                  </strong>
                </td>

                <td>
                  ${escapeHtml(
                    formatGrade(
                      item.grade
                    )
                  )}
                </td>

                <td>
                  ${Number(
                    item.correct || 0
                  )} / 25
                </td>

                <td>
                  <strong>
                    ${Number(
                      item.score || 0
                    )}
                  </strong>
                </td>

                <td>
                  ${formatTime(
                    Number(
                      item.time || 0
                    )
                  )}
                </td>

              </tr>

            `
          )
          .join("");

    }


    /* =========================
       SINIF ADI
    ========================= */

    function formatGrade(grade) {

      if (!grade) {
        return "Tüm Sınıflar";
      }

      if (
        String(grade)
          .toLowerCase() ===
        "diger"
      ) {

        return "Diğer";

      }


      return `${grade}. Sınıf`;

    }


    /* =========================
       SÜRE
    ========================= */

    function formatTime(seconds) {

      seconds =
        Number(seconds || 0);


      if (!seconds) {
        return "-";
      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      const remainingSeconds =
        seconds % 60;


      return `${minutes}:${String(
        remainingSeconds
      ).padStart(2, "0")}`;

    }


    /* =========================
       HTML GÜVENLİĞİ
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       YAZDIR
    ========================= */

    function printResults() {

      const grade =
        document
          .getElementById("grade")
          .value;


      const gradeText =
        formatGrade(grade);


      const rows =
        document
          .getElementById("resultsBody")
          .innerHTML;


      const count =
        document
          .getElementById("count")
          .textContent;


      const bestScore =
        document
          .getElementById("bestScore")
          .textContent;


      const bestTime =
        document
          .getElementById("bestTime")
          .textContent;


      const printWindow =
        window.open(
          "",
          "_blank"
        );


      if (!printWindow) {

        alert(
          "Yazdırma penceresi açılamadı. Tarayıcınızın açılır pencere iznini kontrol edin."
        );

        return;

      }


      const date =
        new Date()
          .toLocaleDateString(
            "tr-TR"
          );


      printWindow.document.write(`

        <!DOCTYPE html>

        <html lang="tr">

        <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>
            HANGİSİ ASAL? - Sonuçlar
          </title>

          <style>

            * {
              box-sizing: border-box;
            }

            body {
              font-family:
                Arial,
                Helvetica,
                sans-serif;

              color: #111827;

              padding: 25px;
            }

            h1 {
              text-align: center;
              margin: 0;
              font-size: 26px;
            }

            h2 {
              text-align: center;
              font-weight: normal;
              margin: 6px 0;
            }

            .date {
              text-align: right;
              color: #555;
              margin-top: 20px;
            }

            .summary {
              display: flex;
              justify-content: center;
              gap: 30px;
              margin: 20px 0;
              font-weight: bold;
            }

            table {
              width: 100%;
              border-collapse: collapse;
              margin-top: 20px;
            }

            th,
            td {
              border: 1px solid #999;
              padding: 8px;
              text-align: center;
            }

            th {
              background: #eeeeee;
            }

            .avatar {
              font-size: 20px;
            }

            @media print {

              body {
                padding: 10px;
              }

              table {
                font-size: 11px;
              }

            }

          </style>

        </head>


        <body>

          <h1>
            HANGİSİ ASAL?
          </h1>

          <h2>
            Murat Hoca İle Matematik
          </h2>

          <h2>
            ${escapeHtml(gradeText)}
            Sonuçları
          </h2>


          <div class="date">
            Tarih: ${date}
          </div>


          <div class="summary">

            <span>
              Katılımcı: ${count}
            </span>

            <span>
              En Yüksek Puan: ${bestScore}
            </span>

            <span>
              En İyi Süre: ${bestTime}
            </span>

          </div>


          <table>

            <thead>

              <tr>

                <th>Sıra</th>
                <th>Avatar</th>
                <th>Ad Soyad</th>
                <th>Sınıf</th>
                <th>Doğru</th>
                <th>Puan</th>
                <th>Süre</th>

              </tr>

            </thead>


            <tbody>

              ${rows}

            </tbody>

          </table>


        </body>

        </html>

      `);


      printWindow.document.close();


      printWindow.focus();


      setTimeout(
        function() {

          printWindow.print();

        },
        500
      );

    }


    /* =========================
       MESAJLAR
    ========================= */

    function showLoginMessage(message) {

      const element =
        document
          .getElementById("loginMessage");


      element.textContent =
        message;


      element.style.display =
        "block";

    }


    function showPanelMessage(
      message,
      isError = false
    ) {

      const element =
        document
          .getElementById("panelMessage");


      element.textContent =
        message;


      element.className =
        "message " +
        (
          isError
            ? "error"
            : "success"
        );


      element.style.display =
        "block";


      setTimeout(
        function() {

          element.style.display =
            "none";

        },
        3000
      );

    }


    /* =========================
       ENTER TUŞU
    ========================= */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            login();

          }

        }
      );

  </script>

</body>
</html>
